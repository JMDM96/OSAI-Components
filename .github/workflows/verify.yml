name: Verify components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run browsers:install
      - run: npm run verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-verification
          path: |
            dist/
            test-results/
          retention-days: 14
